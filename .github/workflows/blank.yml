name: Minecraft Server Runner

on:
  workflow_dispatch:

jobs:
  run-minecraft:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi Minecraft Server i Cloudflare
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jre-headless jq
          
          # Automatski preuzmi najnoviji Minecraft Server.jar
          MC_URL=$(curl -s https://launchermeta.mojang.com/mc/game/version_manifest.json | jq -r '.latest.release as $latest | .versions[] | select(.id == $latest) | .url' | xargs curl -s | jq -r '.downloads.server.url')
          wget -O server.jar "$MC_URL"
          
          echo "eula=true" > eula.txt
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Pokreni Minecraft Server (6GB RAM)
        run: |
          cloudflared tunnel --url tcp://localhost:25565 > cloudflare.log 2>&1 &
          sleep 8
          echo "========================================="
          echo "TVOJA JAVNA ADRESA ZA SPAJANJE SE NALAZI ISPOD:"
          grep -o 'trycloudflare.com:[0-9]*' cloudflare.log || cat cloudflare.log
          echo "========================================="
          java -Xmx6G -Xms4G -jar server.jar nogui
